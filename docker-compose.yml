services:
  # Datadog Agent：接收两个 Go 服务的 APM traces / dogstatsd metrics / logs
  datadog-agent:
    image: datadog/agent:latest
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_ENV=development
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=name:datadog-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

  order-service:
    build: ./order-service
    environment:
      - DD_AGENT_HOST=datadog-agent
      - DD_ENV=development
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
    depends_on:
      - datadog-agent
    ports:
      - "9100:9100"

  backend:
    build: ./backend
    environment:
      - ORDER_SERVICE_URL=http://order-service:9100
      - DD_AGENT_HOST=datadog-agent
      - DD_ENV=development
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
    depends_on:
      - order-service
      - datadog-agent
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
